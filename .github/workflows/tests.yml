name: offline-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04  # what zab runs on: the VMs, the image, the admin server
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # age and age-keygen, which the backup tests run rather than skip (#419, #473)
      - run: sudo apt-get -q update && sudo apt-get -q -y install age
      - run: python -m pip install uv
      - run: uv sync --locked
      # In parallel (pytest-xdist). A pull request leaves out the tests marked `slow`
      # (pyproject.toml); a push to main runs them all. The step's own timeout ends a hung
      # run while the runner can still upload its log, which the job's would lose (#473).
      # The tests marked `timing` run in the job below.
      - if: github.event_name == 'pull_request'
        timeout-minutes: 12
        run: uv run pytest -n auto -m "not slow and not timing" -rs --durations=20
      - if: github.event_name != 'pull_request'
        timeout-minutes: 12
        run: uv run pytest -n auto -m "not timing" -rs --durations=20
      - run: uv run ruff check
      - run: uv run ruff format --check
  # The tests marked `timing` bound CPU against a reference timed in the same run. A runner's
  # two vCPUs are one core's two threads, and another xdist worker on the second thread swings
  # a process's CPU by up to 1.7 times, more than these bounds allow; so they run here, one at
  # a time, beside the jobs above (#485). A pull request leaves out the `slow` ones too. Without
  # xdist (`-p no:xdist`): an `-n` added here is then an error, not four silent skips (#492).
  timing:
    runs-on: ubuntu-24.04  # what zab runs on: the VMs, the image, the admin server
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked
      - if: github.event_name == 'pull_request'
        timeout-minutes: 12
        run: uv run pytest -p no:xdist -m "timing and not slow" -rs --durations=10
      - if: github.event_name != 'pull_request'
        timeout-minutes: 12
        run: uv run pytest -p no:xdist -m timing -rs --durations=10
