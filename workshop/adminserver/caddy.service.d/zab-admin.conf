# /etc/systemd/system/caddy.service.d/zab-admin.conf (docs/ADMIN.md §1.2, §4.3). Caddy is the
# only internet-facing process: it gets no IMDS (here and in imds.nft) and no zab files, and the
# hardening of the zab units, less the one capability it needs for ports 80 and 443. It does not
# start unless the IMDS rule has loaded.
[Unit]
Requires=zab-admin-imds.service
After=zab-admin-imds.service

[Service]
IPAddressDeny=169.254.169.254 fd00:ec2::254
InaccessiblePaths=-/etc/zab-admin/secrets -/var/lib/zab-admin
# Its certificates and autosave, under its home
ReadWritePaths=/var/lib/caddy
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
