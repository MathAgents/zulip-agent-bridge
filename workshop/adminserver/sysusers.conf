# /etc/sysusers.d/zab-admin.conf: one Unix user per process that holds, or must not hold, a key
# (docs/ADMIN.md §1.2). Each gets a group of its own name. Caddy's user comes with its package.
# A process can read another of the same uid's files through /proc/<pid>/root, whatever its own
# mount namespace hides, so a boundary between processes needs a user.
#Type Name        ID GECOS                                  Home directory
u     zab-admin   -  "zab admin bots and collector"         /var/lib/zab-admin
u     zab-starter -  "zab starter, the role but no keys"    /var/lib/zab-starter
u     zab-console -  "zab console, no keys"                 /var/lib/zab-console
u     zab-waker   -  "zab waker, no fleet keys"             /var/lib/zab-waker
u     zab-build   -  "zab release builds, no keys"          /
