# /etc/tmpfiles.d/zab-admin.conf: the admin server's directories, owners and modes
# (docs/ADMIN.md §1.3). console/ and waker/ are setgid, so what the bot writes there gets the
# reader's group; the bot sets each such file to 0640 itself, since every unit has UMask=0077.
# Per-workshop directories (ws/<name>/) are the bot's to create, 0700. `f` never truncates.
# The waker's state (its unit's StateDirectory, 0711) holds status/, setgid zab-admin: the
# waker writes its status file there 0640 for the collector (ADMIN §4.1).
# waker/config.toml starts as a starter-mode config with no workshop, on which the waker
# idles until push_waker.py --config-dir writes the first opt-in.
#Type Path                                   Mode User      Group       Age Argument
d     /etc/zab-admin                         0755 root      root        -
d     /etc/zab-admin/secrets                 0750 root      zab-admin   -
d     /etc/zab-admin/secrets/bots            0750 root      zab-admin   -
d     /etc/zab-admin/break-glass             0755 root      root        -
d     /opt/zab-admin                         0755 root      root        -
d     /opt/zab-admin/releases                0755 root      root        -
d     /var/lib/zab-admin                     0711 zab-admin zab-admin   -
d     /var/lib/zab-admin/.ssh                0700 zab-admin zab-admin   -
d     /var/lib/zab-admin/ws                  0700 zab-admin zab-admin   -
d     /var/lib/zab-admin/runs                0700 zab-admin zab-admin   -
d     /var/lib/zab-admin/releases            0700 zab-admin zab-admin   -
d     /var/lib/zab-admin/releases/wheels     0700 zab-admin zab-admin   -
d     /var/lib/zab-admin/console             2750 zab-admin zab-console -
d     /var/lib/zab-admin/console/tokens      2770 zab-admin zab-console -
d     /var/lib/zab-admin/collector           0700 zab-admin zab-admin   -
d     /var/lib/zab-admin/waker               2750 zab-admin zab-waker   -
f     /var/lib/zab-admin/waker/config.toml   0640 zab-admin zab-waker   -   # push_waker.py --config-dir replaces this file; until then no workshop: the waker idles\nstarter = "/run/zab-admin-starter/start.sock"\nstate_dir = "/var/lib/zab-waker"\nstatus_file = "/var/lib/zab-waker/status/waker.json"
d     /var/lib/zab-waker                     0711 zab-waker zab-waker   -
d     /var/lib/zab-waker/status              2750 zab-waker zab-admin   -
# The starter's start log (#359): its state 0711, as its unit makes it, so that log/, setgid
# zab-admin, is the bots' to read (each file 0640, set by the starter) and nobody else's; nothing
# of the waker's can write it. The bots refuse to start on other owners or modes.
d     /var/lib/zab-starter                   0711 zab-starter zab-starter -
d     /var/lib/zab-starter/log               2750 zab-starter zab-admin   -
# The root config helper's state (ADMIN §2.9): its outcome and its change record, root's, and
# !new-workshop's request directory inside, the bot's alone: its parent root's, so the bot can't
# swap it for another (review of #421). The helper reads, claims and deletes each request.
d     /var/lib/zab-admin-config              0755 root      root        -
d     /var/lib/zab-admin-config/requests     0700 zab-admin zab-admin   -
# The upgrade helpers' state (ADMIN §1.6, #569), root's: !upgrade-server's request directory
# inside, the bot's alone, as the config helper's is; results/, root's, the outcomes the bot
# reads (each 0644). The helpers make their release repository and work directories, 0700.
d     /var/lib/zab-admin-upgrade             0755 root      root        -
d     /var/lib/zab-admin-upgrade/requests    0700 zab-admin zab-admin   -
d     /var/lib/zab-admin-upgrade/results     0755 root      root        -
f     /var/lib/zab-admin/retired-slugs.txt   0600 zab-admin zab-admin   -
f     /var/lib/zab-admin/audit.jsonl         0600 zab-admin zab-admin   -
h     /var/lib/zab-admin/audit.jsonl         -    -         -           -   +a
