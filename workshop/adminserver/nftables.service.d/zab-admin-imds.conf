# /etc/systemd/system/nftables.service.d/zab-admin-imds.conf (docs/ADMIN.md §1.2). Ubuntu's
# nftables.service flushes the whole ruleset when it starts or reloads (/etc/nftables.conf begins
# with `flush ruleset`) and when it stops (`nft flush ruleset`), each in a transaction of its own.
# These replace its three commands with ones that commit the IMDS rule in the same transaction
# as the flush, so that no start, reload, restart or stop leaves even a moment without it.
[Service]
ExecStart=
ExecStart=/usr/sbin/nft -f /etc/zab-admin/nftables-imds.nft
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/zab-admin/nftables-imds.nft
ExecStop=
ExecStop=/usr/sbin/nft -f /etc/zab-admin/nftables-stop-imds.nft
