# The image's tools: the source of /etc/zab/tools.json (issue #474; workshop/ami/README.md).
# build.sh runs every check below at the end of the build, through bin/tools_manifest.py, and
# writes the manifest only if all of them pass; `build_ami.py --smoke` runs them again on a
# fresh instance from the image. `!tools` and the agents' instructions are built from it.
# Entries are grouped by area, the areas in the order of `areas`; tools_manifest.py enforces it.
#
# One [[tool]] per tool a participant or an agent would call, with one preferred way to call it
# (where a tool exists twice, as GAP and Singular do, each copy is its own entry and says when
# to prefer it):
#   name      what people call it; unique
#   area      one of `areas` below
#   call      the preferred command line: one line, at most 100 characters, with an `@` only
#             right after an ASCII letter, digit or `.` (the agents' instructions leave out a call
#             with any other: Claude Code could read it as a file import; no `@var x y`)
#   summary   what it is for: one line, at most 120 characters
#   version   shell command printing the version on its first line (no spaces)
#   check     shell command doing a small real computation, not just --version ...
#   expect    ... whose output's last line must be exactly this
#   timeout   seconds allowed for each of the two commands (default 300)
#   requires  "magma" or "sage": only on images built with that component
#   remote    true for a service off the VM (the LMFDB): its check is tried three times, and on
#             `check` a version that moved since the build is reported, not a failure
# The commands run under bash as agent, each in an empty scratch directory, with the services'
# PATH (~/venv/bin, ~/.elan/bin, ~/.local/bin, /usr/local/bin, /usr/bin, /bin): `python3` is the
# venv's, and every command resolves the way an agent's would. A failing check fails the build.
schema = 1

# The fixed set of areas, in display order, so that lists group well. Add one only for a tool
# that fits none of them; every area must have a tool.
areas = [
  "Number theory",
  "General computer algebra",
  "Groups and representation theory",
  "Commutative algebra and algebraic geometry",
  "Polyhedral geometry and combinatorics",
  "Low-dimensional topology",
  "Optimization and constraint solving",
  "Numerics, statistics and data",
  "Formal proof",
  "Documents and figures",
]

# ------------------------------------------------------------------------------- Number theory

[[tool]]
name = "PARI/GP"
area = "Number theory"
call = "gp -q file.gp </dev/null"
summary = "Number fields, elliptic curves, L-functions; elldata, galdata, seadata, galpol, nflistdata"
version = "gp --version-short"
check = '''
echo 'print(ellanalyticrank(ellinit("389a1"))[1])' | gp -q -f
'''
expect = "2"

[[tool]]
name = "cypari2"
area = "Number theory"
call = "python3 -c 'import cypari2; print(cypari2.Pari()(\"quadclassunit(-23).no\"))'"
summary = "PARI from Python, in the venv"
version = '''
python3 -c 'from importlib.metadata import version; print(version("cypari2"))'
'''
check = '''
python3 -c 'import cypari2; print(cypari2.Pari()("quadclassunit(-23).no"))'
'''
expect = "3"

[[tool]]
name = "LMFDB"
area = "Number theory"
call = "run_sql {\"sql\": \"SELECT count(*) FROM ec_curvedata WHERE conductor = 11\"}"
summary = "LMFDB's lmfdb MCP server: run_sql, describe_table, overview, search_knowls; remote, its version is the server's"
version = '''
u=$(sed -n '/^\[mcp_servers\.lmfdb\]/,/^\[/s/^url = "\(.*\)"$/\1/p' ~/.codex/config.toml)
curl -fsS -m 60 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
  -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"zab-tools","version":"1"}}}' \
  "$u" | sed -n 's/^data: //p; t; /^{/p' | jq -r .result.serverInfo.version
'''
check = '''
u=$(sed -n '/^\[mcp_servers\.lmfdb\]/,/^\[/s/^url = "\(.*\)"$/\1/p' ~/.codex/config.toml)
curl -fsS -m 120 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
  -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_sql","arguments":{"sql":"SELECT count(*) AS n FROM ec_curvedata WHERE conductor = 11"}}}' \
  "$u" | sed -n 's/^data: //p; t; /^{/p' | jq -r '.result.content[0].text | fromjson | .rows[0].n'
'''
expect = "3"
remote = true

