python3 - <<'PY'
import cvxpy as cp
import numpy as np
x = cp.Variable(2)
prob = cp.Problem(cp.Minimize(cp.sum_squares(x - np.array([1.0, 2.0]))), [cp.sum(x) == 1])
prob.solve()
print(round(prob.value, 6))
PY
'''
