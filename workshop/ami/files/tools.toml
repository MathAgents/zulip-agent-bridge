# --------------------------------------------------------- Optimization and constraint solving

[[tool]]
name = "HiGHS"
area = "Optimization and constraint solving"
call = "python3 file.py"
summary = "Linear and mixed-integer programming: import highspy, or scipy.optimize.linprog(method=\"highs\")"
version = '''
python3 -c 'from importlib.metadata import version; print(version("highspy"))'
'''
check = '''
python3 - <<'PY'
import highspy
h = highspy.Highs()
h.setOptionValue("output_flag", False)
x, y = h.addVariable(lb=0), h.addVariable(lb=0)
h.addConstr(x + 2 * y <= 4)
h.addConstr(3 * x + y <= 6)
h.maximize(x + y)
print(round(h.getInfo().objective_function_value, 6))
PY
'''
expect = "2.8"

[[tool]]
name = "SCIP (PySCIPOpt)"
area = "Optimization and constraint solving"
call = "python3 file.py"
summary = "Mixed-integer and constraint programming with SCIP: from pyscipopt import Model"
version = '''
python3 -c 'from importlib.metadata import version; print(version("pyscipopt"))'
'''
check = '''
python3 - <<'PY'
from pyscipopt import Model
m = Model()
m.hideOutput()
x, y = m.addVar(vtype="I", lb=0), m.addVar(vtype="I", lb=0)
m.addCons(x + 2 * y <= 4)
m.addCons(3 * x + y <= 6)
m.setObjective(2 * x + 3 * y, "maximize")
m.optimize()
print(round(m.getObjVal()))
PY
'''
expect = "6"

[[tool]]
name = "PuLP"
area = "Optimization and constraint solving"
call = "python3 file.py"
summary = "Linear and integer programming models (import pulp), solved with the bundled CBC (PuLP 3)"
version = '''
python3 -c 'from importlib.metadata import version; print(version("pulp"))'
'''
check = '''
python3 - <<'PY'
import pulp
p = pulp.LpProblem("t", pulp.LpMaximize)
x = pulp.LpVariable("x", lowBound=0, cat="Integer")
y = pulp.LpVariable("y", lowBound=0, cat="Integer")
p += 2 * x + 3 * y
p += x + 2 * y <= 4
p += 3 * x + y <= 6
p.solve(pulp.PULP_CBC_CMD(msg=False))
print(round(pulp.value(p.objective)))
PY
'''
expect = "6"

[[tool]]
name = "CVXPY"
area = "Optimization and constraint solving"
call = "python3 file.py"
summary = "Convex optimization (import cvxpy): least squares, SOCP, SDP with Clarabel, OSQP, SCS"
version = '''
python3 -c 'from importlib.metadata import version; print(version("cvxpy"))'
'''
